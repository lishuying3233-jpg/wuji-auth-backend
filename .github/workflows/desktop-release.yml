name: Build and publish desktop release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.11'
        required: true
        default: 'v0.1.11'

permissions:
  contents: write

env:
  DESKTOP_DIR: desktop-client

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package version
        shell: bash
        working-directory: desktop-client
        run: |
          actual="$(node -p "require('./package.json').version")"
          expected="${{ steps.release.outputs.version }}"
          if [ "$actual" != "$expected" ]; then
            echo "package.json version $actual does not match release tag $expected"
            exit 1
          fi

      - name: Install dependencies
        working-directory: desktop-client
        run: npm ci

      - name: Typecheck
        working-directory: desktop-client
        run: npm run typecheck

      - name: Build Windows installer
        working-directory: desktop-client
        run: npm run build -- --win nsis

      - name: Create or update GitHub Release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "M7社媒助手 $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            desktop-client/release/*.exe \
            desktop-client/release/*.blockmap \
            desktop-client/release/latest.yml
